# Сценарий 9 канона (workflow#11): PR Dependabot заранее известного типа.
# requests — только patch, packaging — только major (группа `probe` в pyproject.toml).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    # PR не перестраиваются сами при каждом движении `main` (workflow#336): догон —
    # `@dependabot rebase`, когда PR пора сливать.
    rebase-strategy: disabled
    ignore:
      - dependency-name: requests
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: packaging
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: pytest
      - dependency-name: ruff
