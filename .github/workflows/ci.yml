name: CI

on:
  push:
    branches: [main]
  # Черновой PR — без CI (workflow#336): задача пропускается на черновике, полный прогон — при
  # переводе из черновика и на каждый push в PR не черновиком.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Раз в сутки на `main`: красный `main` виден, даже если мёрж шёл мимо push-CI (авто-мёрж
  # Dependabot токеном workflow push-CI не запускает).
  schedule:
    - cron: "0 3 * * *"
  # Ручной полный прогон `main` — выход из остановки линии (workflow#357).
  workflow_dispatch:

# Контракт CI оркестратора (workflow#335, «Ожидаемые job CI» шаблона профиля): новый push в PR
# отменяет прогон старого head; прогоны `main` — каждый в своей группе (по коммиту) и не
# отменяются: по последнему из них оркестратор узнаёт «`main` красный».
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ночь без изменений `main` пропускается, но не дольше 3 суток (workflow#357, контракт CI
  # шаблона профиля): последний полный прогон `main` зелёный, на том же коммите и моложе 60 ч.
  night:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.last.outputs.skip }}
    steps:
      - id: last
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          since=$(date -u -d '60 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh run list --workflow "$WORKFLOW" --branch main --status completed --limit 30 \
            --json databaseId,event \
            --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId')
          skip=false
          for id in $ids; do
            run=$(gh run view "$id" --json conclusion,headSha,createdAt,jobs)
            full=$(jq '[.jobs[] | select(.name != "night" and .conclusion != "skipped")] | length > 0' <<<"$run")
            [ "$full" = true ] || continue
            skip=$(jq --arg sha "$GITHUB_SHA" --arg since "$since" \
              '.conclusion == "success" and .headSha == $sha and .createdAt > $since' <<<"$run")
            break
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  test:
    needs: night
    if: >-
      !cancelled() && needs.night.outputs.skip != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action читает коммиты PR через API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Быстрые проверки — первыми: замок канона, длина `CLAUDE.md`, линтер и формат.
      - run: python scripts/canon/check_lock.py
      - run: python3 scripts/canon/claude_md_length.py
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Секрет в коммитах PR роняет job (workflow#59); идёт и после упавших шагов до него.
      # Только на PR; находка — в логе job (комментарии в PR требуют права записи).
      - if: github.event_name == 'pull_request' && (success() || failure())
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
      # Отчёт по каждому тесту — файлом прогона: по нему оркестратор называет упавшие тесты.
      - run: pytest -q --junitxml=test-report.xml
      # Тестов не было (упало раньше) — пустой отчёт: он заменит отчёт прошлой попытки.
      - if: success() || failure()
        run: test -f test-report.xml || echo '<testsuites/>' > test-report.xml
      - if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-test
          path: test-report.xml
          overwrite: true
          # Отчёт `main` живёт дольше: по нему узнаётся «`main` красный».
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
