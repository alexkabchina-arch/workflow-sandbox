# Вендорен из канона alexkabchina-arch/workflow (`canon-sync`, `.canon.lock`): руками не править.
#
# Перезапуск сторожа `review-guard` (#163): успешный статус `review` от `ship-finish` пришёл, когда
# прогон сторожа уже упал («нет успешной отметки review» после 2 минут ожидания), — прогон
# перезапускается и видит отметку. Событие `status` — из ветки по умолчанию; статус от токена
# workflow его не порождает (отметку `dependabot-review` догоняет его собственный джоб).
# На каждое событие `status` в репозитории — прогон; не про `review` — пропущен.
# Повторный `ship-finish` статус не ставит, если отметка уже стоит: застрявшего сторожа
# перезапускает `gh run rerun <id> --failed` (id — в проверках PR).
name: review-guard-rerun

on:
  status:

permissions: {}

jobs:
  review-guard-rerun:
    if: github.event.context == 'review' && github.event.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Перезапуск сторожа
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
        run: |
          run=
          for _ in 1 2 3 4 5 6; do
            run=$(gh run list -R "$GITHUB_REPOSITORY" -w review-guard.yml -e pull_request_target \
              -c "$SHA" -L 1 --json databaseId -q '.[0].databaseId') || run=
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "прогона сторожа на $SHA нет: он запустится сам и увидит отметку"
            exit 0
          fi
          gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status > /dev/null && exit 0
          gh run rerun "$run" -R "$GITHUB_REPOSITORY" --failed
