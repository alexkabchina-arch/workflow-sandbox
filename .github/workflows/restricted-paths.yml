# Вендорен из канона alexkabchina-arch/workflow (`canon-sync`, `.canon.lock`): руками не править.
#
# Обязательная проверка `restricted-paths`: PR, задевающий пути-ограничители из `.github/CODEOWNERS`,
# падает — авто-мёрж не сработает, сливает владелец кнопкой с обходом правил. Нужна, потому что
# одобрение код-оунера не требуется, когда автор PR сам код-оунер (агенты работают под учётной
# записью владельца).
#
# `pull_request_target`: workflow, скрипт и CODEOWNERS берутся из базовой ветки, код PR не
# выгружается и не исполняется — PR не может ослабить собственную проверку. Список файлов — через API.
name: restricted-paths

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

jobs:
  restricted-paths:
    runs-on: ubuntu-latest
    steps:
      # На pull_request_target checkout по умолчанию выгружает базовую ветку, не PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Файлы PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: >
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files"
          --jq '.[] | .filename, (.previous_filename // empty)'
          > "$RUNNER_TEMP/pr-files.txt"
      - name: Пути-ограничители
        run: python3 scripts/canon/restricted_paths.py .github/CODEOWNERS "$RUNNER_TEMP/pr-files.txt"
