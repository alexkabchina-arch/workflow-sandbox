# Вендорен из канона alexkabchina-arch/workflow (`canon-sync`, `.canon.lock`): руками не править.
#
# Обязательная проверка `restricted-paths`: PR, задевающий пути-ограничители из `.github/CODEOWNERS`,
# падает — авто-мёрж не сработает, сливает владелец кнопкой с обходом правил. Нужна, потому что
# одобрение код-оунера не требуется, когда автор PR сам код-оунер (агенты работают под учётной
# записью владельца).
#
# `pull_request_target`: workflow, скрипт и CODEOWNERS берутся из ветки по умолчанию (так GitHub
# делает с 08.12.2025 при любой базе PR), код PR не выгружается и не исполняется — PR не может
# ослабить собственную проверку. Список файлов — через API, он зависит от базы PR: `edited` —
# перезапуск при смене базы (`gh pr edit --base main`), иначе на PR в `main` осталась бы зелёная
# проверка по файлам относительно другой ветки (#82).
name: restricted-paths

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# Прогон по старой базе, закончившийся позже прогона `edited`, не перекрывает его: отменяется.
concurrency:
  group: restricted-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  restricted-paths:
    runs-on: ubuntu-latest
    steps:
      # На pull_request_target checkout выгружает ветку по умолчанию, не PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Файлы PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: >
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files"
          --jq '.[] | .filename, (.previous_filename // empty)'
          > "$RUNNER_TEMP/pr-files.txt"
      - name: Пути-ограничители
        run: python3 scripts/canon/restricted_paths.py .github/CODEOWNERS "$RUNNER_TEMP/pr-files.txt"
