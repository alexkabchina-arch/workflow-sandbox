[project]
name = "workflow-sandbox"
version = "0.1.0"
description = "Песочница для контрольных сценариев процесса агентной разработки"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Сценарий 9 (workflow#11): закреплённые версии с известным типом обновления Dependabot.
# В CI не ставятся (`.[dev]`).
probe = ["requests==2.32.0", "packaging==23.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
