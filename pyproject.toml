[project]
name = "workflow-sandbox"
version = "0.1.0"
description = "Песочница для контрольных сценариев процесса агентной разработки"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Сценарий 9 (workflow#11): закреплённые версии с известным типом обновления Dependabot.
# В CI не ставятся (`.[dev]`).
probe = ["requests==2.32.5", "packaging==23.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Вендоренный канон (`canon-sync`, `.canon.lock`) не правится в проекте: его проверяет CI канона
# своими настройками, линтер проекта его не видит.
extend-exclude = ["scripts/canon/"]
# Исключение и для файлов, переданных явно (`ruff check <файлы>`, хуки).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
